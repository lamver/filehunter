[package]
name = "filehunter"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
filecat-core = { path = "../../crates/core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
trash = "5"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
notify = "6.1"
iroh = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
iroh-mdns-address-lookup = "*"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rand = "0.9"
blake3 = "1.5"
rayon = "1.10"
# поиск по смыслу: multilingual-e5-small через ONNX Runtime (собирается в exe), на процессоре
fastembed = { version = "=7.1.0", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
