# Сборка FileHunter под Windows и macOS.
#
# Тег v* — тесты, сборка и выпуск на странице Releases вместе с latest.json,
# по которому программа находит обновления. Кнопка «Run workflow» — то же
# без выпуска: установщики лежат в артефактах запуска (для проверки).
#
# Нужен секрет TAURI_SIGNING_PRIVATE_KEY — закрытый ключ подписи обновлений
# (у владельца в %USERPROFILE%\.tauri\filehunter.key). Без него сборка падает:
# неподписанное обновление программа всё равно не примет.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI: '@tauri-apps/cli@2.12.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            # один .app для Intel и Apple Silicon
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Тесты
        run: cargo test --workspace --release

      # что нового — раздел этой версии из CHANGELOG.md; его же покажет окно обновления
      - name: Что нового
        shell: bash
        run: |
          v=$(grep -m1 '"version"' app/src-tauri/tauri.conf.json | sed 's/.*"\([0-9][0-9.]*\)".*/\1/')
          notes=$(awk -v h="## $v" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          { echo "NOTES<<NOTES_END"; echo "$notes"; echo "NOTES_END"; } >> "$GITHUB_ENV"

      - name: Сборка и выпуск
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: app
          tauriScript: npx --yes ${{ env.TAURI_CLI }}
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'FileHunter __VERSION__ (beta)'
          releaseBody: |
            ${{ env.NOTES }}

            Beta release. The interface is in Russian for now.

            **Windows:** `FileHunter_*_x64-setup.exe` is the installer, `*_portable.exe` runs without installing.
            Not signed by Microsoft yet: in the SmartScreen window click "More info" → "Run anyway".

            **macOS (Intel and Apple Silicon):** `FileHunter_*_universal.dmg`. Not signed by Apple yet:
            if macOS refuses to open it, run `xattr -dr com.apple.quarantine /Applications/FileHunter.app` in Terminal.

            An installed copy updates itself: «О программе» (About) → «Проверить обновления».
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Portable-версия для Windows
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Copy-Item target/release/filehunter.exe "FileHunter_${v}_x64_portable.exe"
          gh release upload "${{ github.ref_name }}" "FileHunter_${v}_x64_portable.exe" --clobber

      - name: Установщики в артефакты (сборка без выпуска)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: FileHunter-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/filehunter.exe
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
