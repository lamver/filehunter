[package]
name = "filecat-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
bincode = "1.3"
rayon = "1.10"
blake3 = "1.5"
md-5 = "0.10"
memchr = "2.7"
zstd = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
opendal = { version = "0.59", default-features = false, features = ["services-s3", "reqwest-rustls-tls", "layers-retry", "layers-timeout"] }
tokio = { version = "1", features = ["rt"] }
futures = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"
