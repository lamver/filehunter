[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "FSL-1.1-MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

# dev.bat: тестовая версия работает так же быстро, как выпуск (17 млн записей в отладочной
# сборке ворочаются секундами), но пересобирается за минуты: без LTO, по частям, с кэшем
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
